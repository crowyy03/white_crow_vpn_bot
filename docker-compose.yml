services:
  bot:
    build: .
    container_name: vpn-bot
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && python -m src.main"

  scheduler:
    build: .
    container_name: vpn-bot-scheduler
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m src.workers.scheduler

  db:
    image: postgres:17
    container_name: vpn-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bot-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vpn-bot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  caddy:
    image: caddy:2
    container_name: vpn-bot-caddy
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  bot-db-data:
  caddy-data:
  caddy-config:
